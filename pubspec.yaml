name: engrammo
description: "Engrammo: research-backed memory training built with Flutter."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # No cupertino_icons / sensors_plus: nothing references them in the code
  # (icons come from the HugeIcons set, no sensor needed).
  hugeicons: ^1.2.0
  shared_preferences: ^2.5.3
  flutter_svg: ^2.3.0
  dicebear_core: ^10.6.0
  dicebear_styles: ^10.5.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.2.0
  http: ^1.2.0
  # The saved Meta key lives in encrypted storage (iOS Keychain /
  # Android Keystore), not as plain SharedPreferences text.
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Az appban kizárólag HugeIcons van: a Material Icons betűtípus
  # nincs becsomagolva (`Icons` / `Icon` használata tilos).
  uses-material-design: false

  # NINCS `assets:` kulcs a `.env`-hez — szándékosan: a kulcs
  # soha nem kerülhet a becsomagolt appba (a becsomagolt kulcs
  # bárki által kiolvasható a buildelt appból). Helyette:
  # - fejlesztéskor: `sh tool/run.sh` (a helyi, gitignore-olt
  #   `.env` tartalmát `--dart-define` kulcsként adja át, a fájlt
  #   NEM csomagolja be), vagy kézzel
  #   `flutter run --dart-define=MODEL_API_KEY=...`;
  # - éles / első indítás: Beállítások → Meta AI kulcsmező
  #   (titkosított tárolóba mentődik a készüléken).
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Az app betűtípusa: Lexend — olvashatóságra és tanulásra
  # tervezett, barátságos, mégis modern és komoly betű; magyar
  # ékezetekkel (latin-ext). Helyi asset, így offline is működik,
  # nem kell hálózati betöltés. Változó vastagságú (100–900),
  # a Flutter a kért súlyhoz illeszti.
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# App-ikon generálás: `dart run flutter_launcher_icons`
# Források az assets/icon/ mappában (az "E" terv a Letöltések közül):
# - app_icon.png: alapértelmezett (fekete háttér, fehér E) — web/Windows/macOS.
# - app_icon_light.png: világos mód (fehér háttér, fekete E) — iOS light.
# - app_icon_dark.png: sötét mód (fekete háttér, fehér E) — iOS dark, Android.
# - app_icon_tinted.png: szürkeárnyalatos — iOS tinted (iOS 18+).
# - app_icon_foreground.png: fehér E átlátszón — Android adaptív előtér.
# - app_icon_monochrome.png: fekete E átlátszón — Android 13+ témázott ikon.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  image_path_android: "assets/icon/app_icon_dark.png"
  image_path_ios: "assets/icon/app_icon_light.png"
  image_path_ios_dark_transparent: "assets/icon/app_icon_dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/app_icon_tinted.png"
  desaturate_tinted_to_grayscale_ios: true
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
